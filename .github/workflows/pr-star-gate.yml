name: PR star gate

# Fires on any pull request from a fork. pull_request_target runs in the base
# repo's context so GITHUB_TOKEN has write access to close PRs and comment.
# We never check out or run PR code — we only parse the diff metadata and
# call the GitHub API — so the usual pull_request_target risks don't apply.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-star-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-stars:
    if: github.event.pull_request.state == 'open'
    runs-on: ubuntu-latest
    steps:
      - name: Star-gate check
        uses: actions/github-script@v7
        env:
          THRESHOLD: '10'
        with:
          script: |
            const threshold = parseInt(process.env.THRESHOLD, 10);
            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = pr.number;

            // Pull the PR's unified diff.
            const diffRes = await github.rest.pulls.get({
              owner, repo, pull_number: prNumber,
              mediaType: { format: 'diff' },
            });
            const diff = diffRes.data;
            if (typeof diff !== 'string') {
              core.info('No diff available; skipping.');
              return;
            }

            // Look only at lines ADDED to readme.md that are new list entries
            // (`- [name](https://github.com/owner/repo…)`). The first such
            // line is treated as the primary entry.
            const lines = diff.split('\n');
            let inReadme = false;
            const added = [];
            for (const line of lines) {
              if (line.startsWith('diff --git ')) {
                inReadme = /\breadme\.md\b/i.test(line);
                continue;
              }
              if (!inReadme) continue;
              if (!line.startsWith('+')) continue;
              if (line.startsWith('+++')) continue;
              const body = line.slice(1);
              if (/^- \[/.test(body)) added.push(body);
            }

            if (added.length === 0) {
              core.info('PR does not add a readme.md entry; skipping.');
              return;
            }

            // Extract owner/repo from the first added entry.
            let targetRepo = null;
            let nonGithub = false;
            for (const entry of added) {
              const m = entry.match(/github\.com\/([A-Za-z0-9_.-]+)\/([A-Za-z0-9_.-]+?)(?=[)\/#?]|$)/);
              if (m) {
                // Strip trailing .git if present.
                const o = m[1];
                const r = m[2].replace(/\.git$/, '');
                targetRepo = `${o}/${r}`;
                break;
              }
            }
            if (!targetRepo) {
              // No github.com link at all — flag for human review.
              nonGithub = true;
            }

            const closeWith = async (body) => {
              await github.rest.issues.createComment({
                owner, repo, issue_number: prNumber, body,
              });
              await github.rest.pulls.update({
                owner, repo, pull_number: prNumber, state: 'closed',
              });
            };

            if (nonGithub) {
              // Don't auto-close non-GitHub submissions — leave a note for the maintainer.
              await github.rest.issues.createComment({
                owner, repo, issue_number: prNumber,
                body: [
                  "Thanks for the submission! 🙏",
                  "",
                  "This PR doesn't link to a public GitHub repo, so the automated star check can't verify it against our inclusion bar (**more than 10 stars**). A maintainer will take a look.",
                ].join("\n"),
              });
              await github.rest.issues.addLabels({
                owner, repo, issue_number: prNumber,
                labels: ['needs-maintainer-review'],
              }).catch(() => {}); // label may not exist yet
              return;
            }

            // Check stars.
            let stars = null;
            let notFound = false;
            try {
              const r = await github.rest.repos.get({
                owner: targetRepo.split('/')[0],
                repo: targetRepo.split('/')[1],
              });
              stars = r.data.stargazers_count;
            } catch (e) {
              if (e.status === 404) {
                notFound = true;
              } else {
                core.setFailed(`GitHub API error: ${e.message}`);
                return;
              }
            }

            if (notFound) {
              await closeWith([
                "Thanks for the contribution! 🙏",
                "",
                `The linked repo **\`${targetRepo}\`** returns a **404** — it may be private, deleted, or the path in the PR is wrong. Since this is a list of public GitHub projects (and we require **more than 10 stars**), I'm closing automatically.`,
                "",
                "Please feel free to reopen with a public repo that meets the threshold.",
                "",
                "_Automated check — contact a maintainer if you think this is wrong._",
              ].join("\n"));
              return;
            }

            if (stars <= threshold) {
              await closeWith([
                "Thanks for the contribution! 🙏",
                "",
                `To keep this list focused on projects with real community traction, we only accept entries whose linked GitHub repo has **more than ${threshold} stars**. **\`${targetRepo}\`** currently has **${stars} star(s)**, so I'm closing this PR automatically for now.`,
                "",
                "Please feel free to reopen once the project crosses the threshold — looking forward to adding it then.",
                "",
                "_Automated check — contact a maintainer if you think this is wrong._",
              ].join("\n"));
              return;
            }

            // Passes the star gate — leave a note and label for human review.
            await github.rest.issues.createComment({
              owner, repo, issue_number: prNumber,
              body: `✅ Automated star check passed — [\`${targetRepo}\`](https://github.com/${targetRepo}) currently has **${stars} stars**, above the >${threshold} threshold. A maintainer will take it from here.`,
            });
            await github.rest.issues.addLabels({
              owner, repo, issue_number: prNumber,
              labels: ['star-gate-passed'],
            }).catch(() => {});
